name: SEO insights

# Pulls Google Search Console + PageSpeed Insights metrics on a ~fortnightly
# cadence and on demand. Output is uploaded as a workflow artifact and printed
# to the run summary — nothing is committed, so it is safe whether this repo is
# public or private. (To keep dated reports in-repo instead, see
# internal:docs/seo-and-search.md → "Switching to committed reports".)

on:
  schedule:
    - cron: "37 5 1,15 * *"   # 1st & 15th each month ≈ every two weeks. 05:37 UTC: off the :00
                              # congestion (07:00 runs landed 5–7 h late), after Cyprus sunrise all
                              # year and 9 h before the earliest sunset-in-UTC (14:37 in December), so
                              # a run's PageSpeed loads only reach Afterglow (and count afterglow-auto)
                              # if delayed by more than 9 h — the report states the Cyprus time either way
  workflow_dispatch: {}       # "Run workflow" button for an on-demand pull

permissions:
  contents: read
  actions: read   # read the previous run's artifact → trend deltas in the report

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        continue-on-error: true   # a PyPI hiccup must not lose the report — the script degrades to 'not installed' for Search Console
        run: pip install -r scripts/requirements.txt

      - name: Pull GSC + PSI + Cloudflare insights
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_TAG: ${{ secrets.CF_ACCOUNT_TAG }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/seo-pull.py --out seo-reports --days 28

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: seo-insights-${{ github.run_id }}
          path: seo-reports/
          retention-days: 90
